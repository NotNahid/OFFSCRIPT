  let openingComplete=false,revealFrame=0,revealStart=null;
  function finishOpening(){
    if(openingComplete)return;
    cancelAnimationFrame(revealFrame);mark.textContent='';
    [...target].forEach((letter,i)=>{
      const span=document.createElement('span');span.className='wordmark-char';span.textContent=letter;
      span.style.setProperty('--letter-delay',Math.abs(i-(target.length-1)/2)*22+'ms');
      span.style.setProperty('--letter-tone','var(--title-'+tones[i%tones.length]+')');
      mark.append(span);
    });
    openingComplete=true;
  }
  function reveal(now){
    if(revealStart===null)revealStart=now;
    const progress=Math.min(1,(now-revealStart)/650),settled=Math.floor(progress*target.length);
    mark.textContent=[...target].map((letter,i)=>i<settled?letter:glyphs[Math.floor(Math.random()*glyphs.length)]).join('');
    if(progress<1)revealFrame=requestAnimationFrame(reveal);else finishOpening();
  }
  if(reduceMotion.matches)finishOpening();else revealFrame=requestAnimationFrame(reveal);
  let rippleTimer=0,lastRipple=-Infinity;
  function stopTitleRipple(){clearTimeout(rippleTimer);mark.classList.remove('title-ripple')}
  mark.addEventListener('pointerenter',event=>{
    if(!openingComplete||event.pointerType==='touch'||reduceMotion.matches||document.hidden)return;
    const now=performance.now();
    if(now-lastRipple<1000)return;
    lastRipple=now;mark.classList.add('title-ripple');
    rippleTimer=setTimeout(stopTitleRipple,680);
  });
  // Finish a started ripple on pointer exit; replay it on subsequent hovers.
  reduceMotion.addEventListener('change',()=>{stopTitleRipple();if(reduceMotion.matches)finishOpening()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTitleRipple()});
}

function setDarkTheme(dark){document.body.classList.toggle('dark',dark);$('#themeSwitch').setAttribute('aria-checked',String(dark));$('.theme-label').textContent=dark?'Dark':'Light';}
try{setDarkTheme(localStorage.getItem('offscript-theme')==='dark')}catch{}
$('#themeSwitch').addEventListener('click',()=>{const dark=!document.body.classList.contains('dark');setDarkTheme(dark);try{localStorage.setItem('offscript-theme',dark?'dark':'light')}catch{}});

// RFC-style CSV: quoted commas, multiline cells, escaped quotes, CRLF, and BOM.
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else if(!quoted&&field.length===0){quoted=true}else if(quoted){quoted=false}else{field+=c}}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw new Error('The published CSV has an unfinished quoted cell.');row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows;}
function safeURL(value){try{const u=new URL(value.trim());return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function normalizeSheet(csv){const rows=parseCSV(csv.replace(/^\uFEFF/,''));if(!rows.length)throw new Error('The sheet needs its header row.');const normalize=v=>v.toLowerCase().replace(/[^a-z0-9]/g,'');const headers=rows.shift().map(normalize);const fields=['title','tags','description','previewimage','overleaflink'];const missing=fields.filter(f=>!headers.includes(f));if(missing.length)throw new Error('Use the five headers: Title, Tags, Description, Preview Image, Overleaf Link.');return rows.map((r,i)=>{const value=key=>String(r[headers.indexOf(key)]||'').trim();const tags=[...new Set(value('tags').split(',').map(v=>v.trim()).filter(Boolean))];return {id:String(i+1).padStart(2,'0'),name:value('title'),tags,description:value('description'),style:tags[0]||'',previewUrl:safeURL(value('previewimage')),overleafUrl:safeURL(value('overleaflink'))}}).filter(t=>t.name);}
function rebuildTags(){const map=new Map();templates.forEach(t=>t.tags.forEach(tag=>{const key=tag.toLowerCase();if(!map.has(key))map.set(key,tag)}));if(activeFilter!=='All'&&!map.has(activeFilter.toLowerCase()))activeFilter='All';$('.filters').innerHTML='<button class="filter" data-filter="All" aria-pressed="'+(activeFilter==='All')+'">All templates</button>'+[...map.values()].map(tag=>'<button class="filter" data-filter="'+esc(tag)+'" aria-pressed="'+(tag.toLowerCase()===activeFilter.toLowerCase())+'">'+esc(tag)+'</button>').join('');}
function syncFocus(){const focused=document.activeElement;return focused?.closest('#grid [data-id]')?{id:focused.dataset.id,stage:focused.classList.contains('stage')}:null;}
function showLoadError(message){$('#syncState').hidden=false;$('#syncState').textContent=loaded?'Update failed. Showing previous data.':message;$('#grid').removeAttribute('aria-busy');if(!loaded){$('#grid').innerHTML='<div class="empty">'+esc(message)+'<button class="filter" id="retryData">Try again</button></div>';$('#status').textContent=message;}}
async function loadSheet(){if(inFlight)return;inFlight=true;lastAttempt=Date.now();$('#refreshData').disabled=true;$('#refreshData').textContent='Refreshing…';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);if(!loaded){$('#syncState').textContent='';$('#syncState').hidden=true;$('#grid').setAttribute('aria-busy','true');$('#grid').innerHTML='<div class="empty">Loading templates…</div>';$('#count').textContent='–';}
try{const url=new URL(SHEET_URL);url.searchParams.set('_ts',Date.now());const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('The sheet is unavailable. Try again.');const csv=await response.text();if(/^\s*</.test(csv))throw new Error('Google returned a page instead of CSV. Check the published link.');if(csv!==lastCSV){const fresh=normalizeSheet(csv),focus=syncFocus();const open=$('#detail').open,openId=currentTemplate,oldName=templates.find(t=>t.id===openId)?.name;templates=fresh;lastCSV=csv;loaded=true;rebuildTags();render();if(open){const updated=templates.find(t=>t.id===openId&&t.name===oldName);if(updated&&visibleTemplates.some(t=>t.id===openId))openTemplate(openId);else $('#detail').close()}else if(focus){const card=[...document.querySelectorAll('#grid [data-id]')].find(el=>el.dataset.id===focus.id&&el.classList.contains(focus.stage?'stage':'previewlink'));card?.focus()}}$('#syncState').textContent='';$('#syncState').hidden=true;$('#grid').removeAttribute('aria-busy');}
catch(error){showLoadError(error.name==='AbortError'?'The sheet took too long to respond. Try again.':error.message||'Could not load templates. Check your connection.')}
finally{clearTimeout(timeout);inFlight=false;$('#refreshData').disabled=false;$('#refreshData').textContent='Refresh';}}
$('#refreshData').addEventListener('click',loadSheet);$('#grid').addEventListener('click',e=>{if(e.target.closest('#retryData'))loadSheet()});
setInterval(()=>{if(!document.hidden)loadSheet()},REFRESH_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastAttempt>3000)loadSheet()});window.addEventListener('focus',()=>{if(Date.now()-lastAttempt>3000)loadSheet()});window.addEventListener('online',loadSheet);
loadSheet();
</script></body></html>
